<script>
const MASTER_DATA = {"clients":[{"name":"الفار","branches":["الفار زايد","الفار الميرغني","الفار ستريب زون","الفار مدينتي","الفار المهندسين","الفار اربيلا","الفار ميفيدا","الفار شيراتون","الفار التسعين الشمالي","الفار التسعين الجنوبي","الفار B 15","الفار B 6","الفار الساحل","اربيلا"]},{"name":"كارفور","branches":["كارفور المعادي","كارفور المقطم","كارفور الماظة","كارفور سيتي لايت","كارفور سيتي سنتر","كارفور داندي مول","كارفور العاشر","كارفور السلام","كارفور الشروق","كارفور العبور","كارفور 15 مايو","كارفور سراية القبة","كارفور مدينتي","كارفور كايرو فيستيفال","كارفور اعمار","كارفور الأهرام","كارفور داون تاون","كارفور  العروبة","كارفور العجمي","كارفور نيو المعادي","كارفور"]},{"name":"أمازون","branches":["امازون الشيخ زايد","امازون أرض الجولف","امازون هليوبوليس","امازون جولدن بلازا","امازون المعادي","امازون فيوتشر مول","امازون 6 اكتوبر","امازون الهرم","امازون الشروق","امازون العبور","امازون الرحاب","امازون العاشر","امازون مدينة نصر ستريت مول","امازون مكرم عبيد","امازون الدقي","امازون احمد عكاشة","امازون شبرا الخيمة","امازون اسكندرية","امازون فيصل","أمازون الشروق","أمازون 6 اكتوبر","3YY5D9WI","PO: 571BSVQS - Inv: QCA2 - مدينة نصر"]},{"name":"سبينس","branches":["سبينس بيرلي رويز","سبينس مدينة نصر","سبينس ارينا مول","سبينس ايناواكس","سبينس النزهة","سبينس المنصورة","سبينس شارع سوريا","سبينس المهندسين","سبينس سيتي سكيب","سبينس استرادا مول","سبينس مكسيم مول","سبينس مول العرب","سبينس الهرم","سبينس مزارا مول","سبينس الشروق","سبينس العبور","سبينس المعادي","سبينس طنطا","سبينس جري بروجيكت","سبينس الساحل"]},{"name":"أوسكار","branches":["أوسكار المعادي","أوسكار مدينتي","أوسكار الشيخ زايد","أوسكار التجمع","أوسكار ايتابا","أوسكار  الماظة"]},{"name":"بندة","branches":["بندة الرحاب","بندة أكتوبر","بندة المعادي","بندة مدينة نصر","بندة العبور"]},{"name":"أولاد رجب","branches":["أولاد رجب حدائق حلوان","أولاد رجب الجولف","أولاد رجب التجنيد","أولاد رجب العالمين","أولاد رجب الظاهر العباسية","أولاد رجب المعادي","أولاد رجب احمد فخري"]},{"name":"اللولو","branches":["تاون بلازا","بارك مول","لولو وادي دجلة","لولو التجمع الخامس"]},{"name":"سوبيكو","branches":["سوبيكو حلوان","سوبيكو شينزو آبي","سوبيكو المطار","سوبيكو الياسمين","سوبيكو النزهة","سوبيكو سوق المدينة","سوبيكو زكي رجب","سوبيكو السويف","سوبيكو وينجيت","سوبيكو الملتلقي","سوبيكو سنترو مول","سوبيكو شبرا الخيمة","سوبيكو العباسية","سوبيكو اهلينا مول","سوبيكو السلام","سوبيكو بدر","سوبيكو المنصورة","سوبيكو طرة","سوبيكو الوايلي","سوبيكو شوتس","سوبيكو الفيوم","سوبيكو القناطر","سوبيكو العمرانية","سوبيكو قويسنا","سوبيكو سنجر شبرا","سوبيكو الازهر"]},{"name":"زهران","branches":["زهران المعادي","زهران مدينتي","زهران زايد","زهران التجمع الاول","زهران التجمع الخامس","زهران سموحة","زهران العجمي"]},{"name":"جيان","branches":["جيان التجمع","جيان الرحاب","التجمع","الرحاب"]},{"name":"سوبر سنتر","branches":["اكتوبر"]},{"name":"بانكيكس","branches":["اكتوبر"]},{"name":"نيو ربيا","branches":["مصر الجديدة"]},{"name":"جودز مارت","branches":["اكتوبر"]},{"name":"وكالة المنصورة","branches":["الجامعة","النوادي","دكرنس","الهايبر","المخت��ط","المشاية","البحر الاعظم","قناة السويس","شربين","بلقاس","الترعة","صن مول","برايم مارت المنصورة","السنبلاوين","اجا","صلاح سالم"]},{"name":"نون","branches":["الساحل"]},{"name":"لوما","branches":["اكتوبر"]},{"name":"برينجو","branches":["القاهرة"]},{"name":"فندق سانت ريجيس","branches":["النيل","العاصمة"]},{"name":"جمعية الحصري","branches":["الحصري"]},{"name":"فندق ماريوت مينا هاوس","branches":["الهرم"]},{"name":"بيج فات","branches":["مصنع الحلويات"]},{"name":"راديسون بلو","branches":[]},{"name":"ابراهيم مطبعة","branches":[]},{"name":"عرفة ماركت","branches":[]},{"name":"كازيون","branches":[]},{"name":"اسلام وحيد","branches":[]},{"name":"احمد جلال","branches":[]},{"name":"عميل نقدي","branches":[]},{"name":"محمود عفيفي","branches":[]},{"name":"سبينيس فاليو","branches":[]},{"name":"هدايات","branches":[]},{"name":"محمد عتريس","branches":[]},{"name":"فلامنجو","branches":[]},{"name":"اكسبشن","branches":[]}],"delegates":["احمد وجية","عاصم المندوب","مصطفى فتحي","محمد حسام","محمود اوفال","محمود الجمل","عبد الله الطاهر","مصطفي زكي","محمود هنداوي","احمد محمد"],"drivers":["عاصم السواق","عبدالله شبرا","عبدة ضهر شرب","ربيع متولي","جلال الزلباني","عاطف ظهر شرب","عبد القادر اوفال","محمود الطبلاوي"]};

// NEW Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyByOrueUjNhgsC22hcZQ5dRac8bpca5s2g",
  authDomain: "oval-receipts.firebaseapp.com",
  projectId: "oval-receipts",
  storageBucket: "oval-receipts.firebasestorage.app",
  messagingSenderId: "651415652827",
  appId: "1:651415652827:web:25215c38e5e11f21883ffe",
  measurementId: "G-T4R28RMJEC"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

const app = createApp({
    setup() {
        const clients = ref(MASTER_DATA.clients || []);
        const delegates = ref(MASTER_DATA.delegates || []);
        const drivers = ref(MASTER_DATA.drivers || []);
        
        const clientNames = computed(() => clients.value.map(c => c.name || c.client));

        const form = ref({
            client: '', branch: '',
            delegate: localStorage.getItem('savedDelegate') || '',
            driver: localStorage.getItem('savedDriver') || '',
            date: '', notes: ''
        });

        const isSubmitting = ref(false);
        const receipts = ref([]);
        const hiddenIds = ref(JSON.parse(localStorage.getItem('hiddenReceipts') || '[]'));
        
        const tab = ref('pending');
        const searchQuery = ref('');
        const currentView = ref('list');

        const currentBranches = computed(() => {
            const c = clients.value.find(x => (x.name || x.client) === form.value.client);
            return c ? c.branches : [];
        });

        const activeReceipts = computed(() => receipts.value.filter(r => !r.isDeleted && !hiddenIds.value.includes(r.id)));
        const pendingCount = computed(() => activeReceipts.value.filter(r => r.status === 'pending_review').length);
        const archivedCount = computed(() => activeReceipts.value.filter(r => r.status === 'archived').length);

        const filteredReceipts = computed(() => {
            let list = activeReceipts.value.filter(r => r.status === (tab.value === 'pending' ? 'pending_review' : 'archived'));
            if (searchQuery.value) {
                const q = searchQuery.value.toLowerCase();
                list = list.filter(r => 
                    (r.client||'').toLowerCase().includes(q) || (r.branch||'').toLowerCase().includes(q) ||
                    (r.delegate||'').toLowerCase().includes(q) || (r.driver||'').toLowerCase().includes(q)
                );
            }
            return list;
        });

        const saveLocal = (key, val) => { localStorage.setItem(key === 'delegate' ? 'savedDelegate' : 'savedDriver', val); };

        const onClientChange = () => {
            const branches = currentBranches.value;
            // Auto-select if there is only one branch
            if (branches.length === 1) {
                form.value.branch = branches[0];
            } else {
                form.value.branch = '';
            }
        };

        const submitReceipt = async () => {
            if(!form.value.delegate || !form.value.driver || !form.value.client || !form.value.branch) {
                Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'يرجى إكمال جميع الحقول المطلوبة' });
                return;
            }
            isSubmitting.value = true;
            try {
                const now = new Date();
                let finalDateStr = '';
                if (form.value.date) {
                    const p = form.value.date.split('-');
                    finalDateStr = `${p[2]}/${p[1]}/${p[0]}`;
                } else {
                    finalDateStr = now.toLocaleDateString('ar-EG', {year:'numeric', month:'2-digit', day:'2-digit'});
                }

                const payload = {
                    client: form.value.client,
                    branch: form.value.branch,
                    delegate: form.value.delegate,
                    driver: form.value.driver,
                    notes: form.value.notes,
                    status: 'pending_review',
                    timestamp: now.toISOString(),
                    dateStr: finalDateStr,
                    timeStr: now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true}),
                    isDeleted: false
                };

                db.collection('delivery_receipts').add(payload).catch(console.error);
                Swal.fire({ icon: 'success', title: 'تم التسجيل', text: 'تم تسجيل الإذن بنجاح', timer: 1500, showConfirmButton: false });
                
                form.value.client = ''; form.value.branch = ''; form.value.notes = ''; form.value.date = '';
                currentView.value = 'list';
                tab.value = 'pending';
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'تأكد من اتصالك بالإنترنت.' });
            } finally {
                isSubmitting.value = false;
            }
        };

        const markAsArchived = async (id) => {
            try {
                await db.collection('delivery_receipts').doc(id).update({ status: 'archived', archivedAt: new Date().toISOString() });
                Swal.fire({ icon: 'success', title: 'تم الأرشفة', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
            } catch(e) { Swal.fire({ icon: 'error', title: 'خطأ', text: 'حدث خطأ أثناء الأرشفة.' }); }
        };

        const softDelete = async (id) => {
            const res = await Swal.fire({ title: 'تأكيد الحذف؟', text: "سيتم حذف هذا الإذن نهائياً!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonText: 'إلغاء', confirmButtonText: 'نعم، احذف' });
            if (res.isConfirmed) {
                hiddenIds.value.push(id);
                localStorage.setItem('hiddenReceipts', JSON.stringify(hiddenIds.value));
                db.collection('delivery_receipts').doc(id).update({ isDeleted: true, status: 'deleted' }).catch(() => {
                    db.collection('delivery_receipts').doc(id).delete().catch(() => {});
                });
                Swal.fire({ icon: 'success', title: 'تم الحذف', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
            }
        };

        onMounted(() => {
            db.collection('delivery_receipts').orderBy('timestamp', 'desc').limit(300)
              .onSnapshot(snap => {
                  const arr = [];
                  snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
                  receipts.value = arr;
              });
        });

        return {
            clientNames, delegates, drivers, form, isSubmitting, receipts, tab, searchQuery, currentView,
            currentBranches, filteredReceipts, pendingCount, archivedCount,
            saveLocal, onClientChange, submitReceipt, markAsArchived, softDelete
        };
    }
});

app.component('custom-select', {
    props: ['modelValue', 'options', 'placeholder', 'icon', 'disabled'],
    emits: ['update:modelValue', 'change'],
    template: `
        <div class="input-group" :class="{'opacity-50 pointer-events-none': disabled}" v-click-outside="close">
            <i :class="icon"></i>
            <div @click="open = !open" class="premium-input flex justify-between items-center" style="padding-right: 48px; padding-left: 16px;">
                <span :class="modelValue ? 'text-slate-800' : 'text-slate-400'">{{ modelValue || placeholder }}</span>
                <i class="fa-solid fa-chevron-down text-sm" style="position: static; transform: none; color: #cbd5e1;"></i>
            </div>
            
            
            <!-- Desktop Dropdown & Mobile Bottom Sheet -->
            <teleport to="body">
                <!-- Overlay for Mobile -->
                <transition name="fade">
                    <div v-if="open" @click="close" class="fixed inset-0 bg-slate-900/40 z-[90] sm:hidden backdrop-blur-sm"></div>
                </transition>

                <transition name="slide-up">
                    <div v-if="open" class="fixed sm:absolute z-[100] sm:z-50 inset-x-0 bottom-0 sm:inset-auto sm:top-auto sm:mt-2 w-full sm:w-[var(--parent-width)] bg-white sm:rounded-xl rounded-t-3xl shadow-2xl border border-slate-100 max-h-[85vh] sm:max-h-64 flex flex-col overflow-hidden" :style="smStyle">
                        
                        <!-- Mobile Handle -->
                        <div class="w-full flex justify-center py-3 sm:hidden bg-slate-50 border-b border-slate-100 cursor-pointer" @click="close">
                            <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
                        </div>

                        <div class="p-3 sm:p-2 border-b border-slate-50 bg-slate-50/50">
                            <div class="relative">
                                <input ref="searchInput" v-model="search" type="text" class="w-full bg-white rounded-xl sm:rounded-lg px-4 py-3 sm:py-2 pr-10 text-base sm:text-sm outline-none border border-slate-200 focus:border-primary shadow-sm" placeholder="ابحث هنا...">
                                <i class="fa-solid fa-search absolute right-3 top-1/2 -translate-y-1/2 text-slate-300"></i>
                            </div>
                        </div>
                        <ul class="overflow-y-auto flex-1 pb-6 sm:pb-0">
                            <li v-if="filtered.length === 0" class="px-5 py-4 text-slate-400 text-sm text-center">لا توجد نتائج</li>
                            <li v-for="opt in filtered" :key="opt" @click="select(opt)" 
                                class="px-5 py-4 sm:py-3 hover:bg-indigo-50 cursor-pointer transition-colors text-base sm:text-sm border-b border-slate-50 last:border-0" 
                                :class="{'bg-indigo-50 text-indigo-700 font-bold': modelValue === opt}">
                                {{ opt }}
                                <i v-if="modelValue === opt" class="fa-solid fa-check float-left text-indigo-600 mt-1"></i>
                            </li>
                        </ul>
                    </div>
                </transition>
            </teleport>

        </div>
    `,
    setup(props, {emit}) {
        const { ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;
        const containerRef = ref(null);
        const smStyle = ref({});
        
        const updatePosition = () => {
            if(!containerRef.value || window.innerWidth < 640) return;
            const rect = containerRef.value.getBoundingClientRect();
            smStyle.value = {
                '--parent-width': rect.width + 'px',
                top: (rect.bottom + window.scrollY) + 'px',
                left: rect.left + 'px'
            };
        };
        const open = ref(false);
        const search = ref('');
        const searchInput = ref(null);

        const filtered = computed(() => {
            if(!search.value) return props.options || [];
            const q = search.value.toLowerCase();
            return (props.options || []).filter(o => String(o).toLowerCase().includes(q));
        });

        const select = (val) => {
            emit('update:modelValue', val);
            emit('change');
            open.value = false;
        };
        const close = () => { open.value = false; };

        
        window.addEventListener('resize', updatePosition);
        window.addEventListener('scroll', updatePosition);
        onBeforeUnmount(() => {
            window.removeEventListener('resize', updatePosition);
            window.removeEventListener('scroll', updatePosition);
        });

        watch(open, (val) => {
            if(val) {
                updatePosition(); }
            if(val) {
                search.value = '';
                nextTick(() => { if(searchInput.value) searchInput.value.focus(); });
            }
        });

        return { open, search, searchInput, filtered, select, close, containerRef, smStyle };
    }
});

// Custom Directive for clicking outside
app.directive('click-outside', {
    mounted(el, binding) {
        el.clickOutsideEvent = function(event) {
            if (!(el === event.target || el.contains(event.target))) {
                binding.value(event);
            }
        };
        document.body.addEventListener('click', el.clickOutsideEvent);
    },
    unmounted(el) {
        document.body.removeEventListener('click', el.clickOutsideEvent);
    }
});

app.mount('#app');
</script>
