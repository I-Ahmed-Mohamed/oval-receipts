<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذونات أوفال - الإصدار الجديد</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#1e40af',
                        accent: '#f59e0b',
                        dark: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Firebase 8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .form-select, .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s;
        }
        .form-select:focus, .form-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background-color: #ffffff;
        }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="text-slate-800 pb-20">

<div id="app" class="max-w-4xl mx-auto p-4 sm:p-6 mt-4">
    <!-- Header -->
    <header class="flex items-center justify-between mb-8 glass-card p-6">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center text-white text-2xl shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-file-signature"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-dark">أذونات أوفال</h1>
                <p class="text-slate-500 text-sm">نظام تسجيل الأذونات السريع</p>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- New Permit Form -->
        <div class="lg:col-span-5">
            <div class="glass-card p-6 sticky top-6">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-primary">
                    <i class="fa-solid fa-plus-circle"></i> إذن جديد
                </h2>

                <form @submit.prevent="submitReceipt" class="space-y-5">
                    
                    <!-- Delegate -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">المندوب</label>
                        <select v-model="form.delegate" @change="saveLocal('delegate', form.delegate)" required class="form-select">
                            <option value="" disabled>-- اختر المندوب --</option>
                            <option v-for="d in delegates" :key="d" :value="d">{{ d }}</option>
                        </select>
                    </div>

                    <!-- Driver -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">السائق</label>
                        <select v-model="form.driver" @change="saveLocal('driver', form.driver)" required class="form-select">
                            <option value="" disabled>-- اختر السائق --</option>
                            <option v-for="d in drivers" :key="d" :value="d">{{ d }}</option>
                        </select>
                    </div>

                    <!-- Client -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">العميل</label>
                        <select v-model="form.client" @change="onClientChange" required class="form-select">
                            <option value="" disabled>-- اختر العميل --</option>
                            <option v-for="c in clients" :key="c.name" :value="c.name">{{ c.name }}</option>
                        </select>
                    </div>

                    <!-- Branch -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">الفرع</label>
                        <select v-model="form.branch" required class="form-select" :disabled="!form.client">
                            <option value="" disabled>-- اختر الفرع --</option>
                            <option v-for="b in currentBranches" :key="b" :value="b">{{ b }}</option>
                        </select>
                    </div>

                    <!-- Date -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">التاريخ (اختياري)</label>
                        <input type="date" v-model="form.date" class="form-input">
                    </div>

                    <!-- Notes -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">ملاحظات (رقم بوليصة الخ)</label>
                        <input type="text" v-model="form.notes" placeholder="ملاحظات إضافية..." class="form-input">
                    </div>

                    <button type="submit" :disabled="isSubmitting" class="w-full bg-primary hover:bg-secondary text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 mt-4 disabled:opacity-50">
                        <i v-if="!isSubmitting" class="fa-solid fa-paper-plane"></i>
                        <i v-else class="fa-solid fa-spinner fa-spin"></i>
                        {{ isSubmitting ? 'جاري التسجيل...' : 'تسجيل الإذن' }}
                    </button>
                </form>
            </div>
        </div>

        <!-- History -->
        <div class="lg:col-span-7">
            <!-- Tabs -->
            <div class="flex gap-2 mb-6 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                <button @click="tab = 'pending'" :class="tab === 'pending' ? 'bg-primary text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'" class="flex-1 py-3 font-bold rounded-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-hourglass-half"></i> المعلقة
                    <span class="bg-white/20 px-2 py-0.5 rounded-full text-sm">{{ pendingCount }}</span>
                </button>
                <button @click="tab = 'archived'" :class="tab === 'archived' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'" class="flex-1 py-3 font-bold rounded-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-box-archive"></i> الأرشيف
                    <span class="bg-white/20 px-2 py-0.5 rounded-full text-sm">{{ archivedCount }}</span>
                </button>
            </div>

            <!-- Search -->
            <div class="relative mb-6">
                <input type="text" v-model="searchQuery" placeholder="ابحث باسم العميل أو الفرع..." class="w-full py-4 pr-12 pl-4 rounded-xl border border-slate-200 shadow-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all">
                <i class="fa-solid fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
            </div>

            <!-- List -->
            <div class="space-y-4">
                <div v-if="filteredReceipts.length === 0" class="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                    <p class="text-slate-500 font-bold">لا يوجد أذونات تطابق بحثك</p>
                </div>

                <div v-for="item in filteredReceipts" :key="item.id" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden">
                    <div v-if="item.status === 'archived'" class="absolute top-0 right-0 bg-slate-800 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">
                        <i class="fa-solid fa-check"></i> مستلم
                    </div>
                    
                    <div class="flex justify-between items-start mb-3 mt-1">
                        <div>
                            <h3 class="font-bold text-lg text-primary">{{ item.client }} <span class="text-slate-400 font-normal mx-1">-</span> <span class="text-slate-700">{{ item.branch }}</span></h3>
                            <div class="text-xs text-slate-500 mt-1 flex items-center gap-3">
                                <span><i class="fa-regular fa-calendar"></i> {{ item.dateStr }}</span>
                                <span><i class="fa-regular fa-clock"></i> {{ item.timeStr }}</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-md border border-blue-100"><i class="fa-solid fa-user-tie"></i> {{ item.delegate }}</span>
                        <span class="bg-orange-50 text-orange-700 text-xs px-2.5 py-1 rounded-md border border-orange-100"><i class="fa-solid fa-truck"></i> {{ item.driver }}</span>
                        <span v-if="item.notes" class="bg-yellow-50 text-yellow-700 text-xs px-2.5 py-1 rounded-md border border-yellow-100"><i class="fa-solid fa-comment"></i> {{ item.notes }}</span>
                    </div>

                    <div class="flex gap-2 pt-3 border-t border-slate-100">
                        <button v-if="tab === 'pending'" @click="markAsArchived(item.id)" class="flex-1 bg-green-50 hover:bg-green-100 text-green-700 font-bold py-2 rounded-lg transition-colors text-sm border border-green-200">
                            <i class="fa-solid fa-check-circle"></i> استلمته
                        </button>
                        <button v-if="tab === 'archived'" @click="softDelete(item.id)" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 rounded-lg transition-colors text-sm border border-red-200">
                            <i class="fa-solid fa-trash"></i> حذف نهائي
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Master Data Hardcoded
const MASTER_DATA = {"clients":[{"name":"الفار","branches":["الفار زايد","الفار الميرغني","الفار ستريب زون","الفار مدينتي","الفار المهندسين","الفار اربيلا","الفار ميفيدا","الفار شيراتون","الفار التسعين الشمالي","الفار التسعين الجنوبي","الفار B 15","الفار B 6","الفار الساحل","اربيلا"]},{"name":"كارفور","branches":["كارفور المعادي","كارفور المقطم","كارفور الماظة","كارفور سيتي لايت","كارفور سيتي سنتر","كارفور داندي مول","كارفور العاشر","كارفور السلام","كارفور الشروق","كارفور العبور","كارفور 15 مايو","كارفور سراية القبة","كارفور مدينتي","كارفور كايرو فيستيفال","كارفور اعمار","كارفور الأهرام","كارفور داون تاون","كارفور  العروبة","كارفور العجمي","كارفور نيو المعادي","كارفور"]},{"name":"أمازون","branches":["امازون الشيخ زايد","امازون أرض الجولف","امازون هليوبوليس","امازون جولدن بلازا","امازون المعادي","امازون فيوتشر مول","امازون 6 اكتوبر","امازون الهرم","امازون الشروق","امازون العبور","امازون الرحاب","امازون العاشر","امازون مدينة نصر ستريت مول","امازون مكرم عبيد","امازون الدقي","امازون احمد عكاشة","امازون شبرا الخيمة","امازون اسكندرية","امازون فيصل","أمازون الشروق","أمازون 6 اكتوبر","3YY5D9WI","PO: 571BSVQS - Inv: QCA2 - مدينة نصر"]},{"name":"سبينس","branches":["سبينس بيرلي رويز","سبينس مدينة نصر","سبينس ارينا مول","سبينس ايناواكس","سبينس النزهة","سبينس المنصورة","سبينس شارع سوريا","سبينس المهندسين","سبينس سيتي سكيب","سبينس استرادا مول","سبينس مكسيم مول","سبينس مول العرب","سبينس الهرم","سبينس مزارا مول","سبينس الشروق","سبينس العبور","سبينس المعادي","سبينس طنطا","سبينس جري بروجيكت","سبينس الساحل"]},{"name":"أوسكار","branches":["أوسكار المعادي","أوسكار مدينتي","أوسكار الشيخ زايد","أوسكار التجمع","أوسكار ايتابا","أوسكار  الماظة"]},{"name":"بندة","branches":["بندة الرحاب","بندة أكتوبر","بندة المعادي","بندة مدينة نصر","بندة العبور"]},{"name":"أولاد رجب","branches":["أولاد رجب حدائق حلوان","أولاد رجب الجولف","أولاد رجب التجنيد","أولاد رجب العالمين","أولاد رجب الظاهر العباسية","أولاد رجب المعادي","أولاد رجب احمد فخري"]},{"name":"اللولو","branches":["تاون بلازا","بارك مول","لولو وادي دجلة","لولو التجمع الخامس"]},{"name":"سوبيكو","branches":["سوبيكو حلوان","سوبيكو شينزو آبي","سوبيكو المطار","سوبيكو الياسمين","سوبيكو النزهة","سوبيكو سوق المدينة","سوبيكو زكي رجب","سوبيكو السويف","سوبيكو وينجيت","سوبيكو الملتلقي","سوبيكو سنترو مول","سوبيكو شبرا الخيمة","سوبيكو العباسية","سوبيكو اهلينا مول","سوبيكو السلام","سوبيكو بدر","سوبيكو المنصورة","سوبيكو طرة","سوبيكو الوايلي","سوبيكو شوتس","سوبيكو الفيوم","سوبيكو القناطر","سوبيكو العمرانية","سوبيكو قويسنا","سوبيكو سنجر شبرا","سوبيكو الازهر"]},{"name":"زهران","branches":["زهران المعادي","زهران مدينتي","زهران زايد","زهران التجمع الاول","زهران التجمع الخامس","زهران سموحة","زهران العجمي"]},{"name":"جيان","branches":["جيان التجمع","جيان الرحاب","التجمع","الرحاب"]},{"name":"سوبر سنتر","branches":["اكتوبر"]},{"name":"بانكيكس","branches":["اكتوبر"]},{"name":"نيو ربيا","branches":["مصر الجديدة"]},{"name":"جودز مارت","branches":["اكتوبر"]},{"name":"وكالة المنصورة","branches":["الجامعة","النوادي","دكرنس","الهايبر","المخت��ط","المشاية","البحر الاعظم","قناة السويس","شربين","بلقاس","الترعة","صن مول","برايم مارت المنصورة","السنبلاوين","اجا","صلاح سالم"]},{"name":"نون","branches":["الساحل"]},{"name":"لوما","branches":["اكتوبر"]},{"name":"برينجو","branches":["القاهرة"]},{"name":"فندق سانت ريجيس","branches":["النيل","العاصمة"]},{"name":"جمعية الحصري","branches":["الحصري"]},{"name":"فندق ماريوت مينا هاوس","branches":["الهرم"]},{"name":"بيج فات","branches":["مصنع الحلويات"]},{"name":"راديسون بلو","branches":[]},{"name":"ابراهيم مطبعة","branches":[]},{"name":"عرفة ماركت","branches":[]},{"name":"كازيون","branches":[]},{"name":"اسلام وحيد","branches":[]},{"name":"احمد جلال","branches":[]},{"name":"عميل نقدي","branches":[]},{"name":"محمود عفيفي","branches":[]},{"name":"سبينيس فاليو","branches":[]},{"name":"هدايات","branches":[]},{"name":"محمد عتريس","branches":[]},{"name":"فلامنجو","branches":[]},{"name":"اكسبشن","branches":[]}],"delegates":["احمد وجية","عاصم المندوب","مصطفى فتحي","محمد حسام","محمود اوفال","محمود الجمل","عبد الله الطاهر","مصطفي زكي","محمود هنداوي","احمد محمد"],"drivers":["عاصم السواق","عبدالله شبرا","عبدة ضهر شرب","ربيع متولي","جلال الزلباني","عاطف ظهر شرب","عبد القادر اوفال","محمود الطبلاوي"]};

// Firebase Init
// ⚠️ هذه إعدادات الفايربيز للمشروع الجديد (فارغة حالياً حتى تقوم بإنشاء مشروع جديد)
/*
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT"
};
firebase.initializeApp(firebaseConfig);

*/
// حالياً هنستخدم LocalStorage كقاعدة بيانات بديلة لحد ما تربط الفايربيز الجديد

const { createApp, ref, computed, onMounted } = Vue;

createApp({
    setup() {
        const clients = ref(MASTER_DATA.clients);
        const delegates = ref(MASTER_DATA.delegates);
        const drivers = ref(MASTER_DATA.drivers);
        
        const form = ref({
            client: '',
            branch: '',
            delegate: localStorage.getItem('savedDelegate') || '',
            driver: localStorage.getItem('savedDriver') || '',
            date: '',
            notes: ''
        });

        const isSubmitting = ref(false);
        const receipts = ref([]);
        const hiddenIds = ref(JSON.parse(localStorage.getItem('hiddenReceipts') || '[]'));
        
        const tab = ref('pending');
        const searchQuery = ref('');

        const currentBranches = computed(() => {
            const c = clients.value.find(x => x.name === form.value.client);
            return c ? c.branches : [];
        });

        const activeReceipts = computed(() => {
            return receipts.value.filter(r => !r.isDeleted && !hiddenIds.value.includes(r.id));
        });

        const pendingCount = computed(() => activeReceipts.value.filter(r => r.status === 'pending_review').length);
        const archivedCount = computed(() => activeReceipts.value.filter(r => r.status === 'archived').length);

        const filteredReceipts = computed(() => {
            let list = activeReceipts.value;
            list = list.filter(r => r.status === (tab.value === 'pending' ? 'pending_review' : 'archived'));
            
            if (searchQuery.value) {
                const q = searchQuery.value.toLowerCase();
                list = list.filter(r => 
                    (r.client || '').toLowerCase().includes(q) ||
                    (r.branch || '').toLowerCase().includes(q) ||
                    (r.delegate || '').toLowerCase().includes(q) ||
                    (r.driver || '').toLowerCase().includes(q)
                );
            }
            return list;
        });

        const saveLocal = (key, val) => {
            localStorage.setItem(key === 'delegate' ? 'savedDelegate' : 'savedDriver', val);
        };

        const onClientChange = () => {
            form.value.branch = '';
        };

        const submitReceipt = async () => {
            isSubmitting.value = true;
            try {
                let finalDateStr = '';
                const now = new Date();
                
                if (form.value.date) {
                    const p = form.value.date.split('-');
                    finalDateStr = `${p[2]}/${p[1]}/${p[0]}`;
                } else {
                    finalDateStr = now.toLocaleDateString('ar-EG', {year:'numeric', month:'2-digit', day:'2-digit'});
                }

                const payload = {
                    client: form.value.client,
                    branch: form.value.branch,
                    delegate: form.value.delegate,
                    driver: form.value.driver,
                    notes: form.value.notes,
                    status: 'pending_review',
                    timestamp: now.toISOString(),
                    dateStr: finalDateStr,
                    timeStr: now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit', hour12:true}),
                    isDeleted: false
                };

                // Save to LocalStorage instead of Firebase
                payload.id = 'rec_' + Date.now();
                const currentReceipts = JSON.parse(localStorage.getItem('localReceiptsDB') || '[]');
                currentReceipts.unshift(payload);
                localStorage.setItem('localReceiptsDB', JSON.stringify(currentReceipts));
                
                // Update the reactive array directly
                receipts.value = currentReceipts;
                
                Swal.fire({ icon: 'success', title: 'تم التسجيل', text: 'تم تسجيل الإذن بنجاح', timer: 1500, showConfirmButton: false });
                
                form.value.client = '';
                form.value.branch = '';
                form.value.notes = '';
                form.value.date = '';
                tab.value = 'pending';
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'حدث خطأ أثناء الإرسال. تأكد من الإنترنت.' });
                console.error(err);
            } finally {
                isSubmitting.value = false;
            }
        };

        const markAsArchived = async (id) => {
            try {
                const currentReceipts = JSON.parse(localStorage.getItem('localReceiptsDB') || '[]');
                const idx = currentReceipts.findIndex(r => r.id === id);
                if(idx > -1) {
                    currentReceipts[idx].status = 'archived';
                    currentReceipts[idx].archivedAt = new Date().toISOString();
                    localStorage.setItem('localReceiptsDB', JSON.stringify(currentReceipts));
                    receipts.value = currentReceipts;
                }
                Swal.fire({ icon: 'success', title: 'تم الأرشفة', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
            } catch(e) {
                console.error(e);
                Swal.fire({ icon: 'error', title: 'خطأ', text: 'حدث خطأ أثناء الأرشفة.' });
            }
        };

        const softDelete = async (id) => {
            const res = await Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "سيتم حذف هذا الإذن نهائياً من الأرشيف!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonText: 'إلغاء',
                confirmButtonText: 'نعم، احذف!'
            });
            
            if (res.isConfirmed) {
                hiddenIds.value.push(id);
                localStorage.setItem('hiddenReceipts', JSON.stringify(hiddenIds.value));
                
                const currentReceipts = JSON.parse(localStorage.getItem('localReceiptsDB') || '[]');
                const idx = currentReceipts.findIndex(r => r.id === id);
                if(idx > -1) {
                    currentReceipts[idx].isDeleted = true;
                    currentReceipts[idx].status = 'deleted';
                    localStorage.setItem('localReceiptsDB', JSON.stringify(currentReceipts));
                    receipts.value = currentReceipts;
                }
                
                Swal.fire({ icon: 'success', title: 'تم الحذف', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
            }
        };

        onMounted(() => {
            const currentReceipts = JSON.parse(localStorage.getItem('localReceiptsDB') || '[]');
            receipts.value = currentReceipts;
        });

        return {
            clients, delegates, drivers, form, isSubmitting, receipts, tab, searchQuery,
            currentBranches, filteredReceipts, pendingCount, archivedCount,
            saveLocal, onClientChange, submitReceipt, markAsArchived, softDelete
        };
    }
}).mount('#app');
</script>
</body>
</html>
